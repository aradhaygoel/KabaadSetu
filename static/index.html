<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KabaadSetu | Formal Recycling Bridge</title>
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>

  <!-- GLOBAL STICKY HEADER -->
  <header class="global-header">
    <div class="brand-bar">
      <div class="brand-title">
        <span style="font-size: 1.6rem;">♻️</span>
        <div>
          <span id="brand-title-text">KabaadSetu</span>
          <span class="brand-badge" id="brand-badge">Formal Chain Bridge</span>
          <div id="brand-tagline" style="font-size: 0.7rem; font-weight: 500; opacity: 0.85;">
            Bridge between Informal Collectors and Formal Recycling
          </div>
        </div>
      </div>
      <div>
        <select id="city-selector" style="background: rgba(255,255,255,0.2); color: #fff; border: 1px solid rgba(255,255,255,0.4); padding: 5px 10px; border-radius: 8px; font-weight: 700; font-size: 0.85rem;">
          <option value="Pune" id="city-opt-pune" style="color: #000;">📍 Pune</option>
          <option value="Hyderabad" id="city-opt-hyderabad" style="color: #000;">📍 Hyderabad</option>
          <option value="Mumbai" id="city-opt-mumbai" style="color: #000;">📍 Mumbai</option>
        </select>
      </div>
    </div>

    <!-- ROLE SWITCHER TABS -->
    <nav class="role-tabs">
      <button class="role-tab-btn active" data-role="collector">
        📱 Collector Mobile
      </button>
      <button class="role-tab-btn" data-role="microhub">
        🏪 Micro-Hub Center
      </button>
      <button class="role-tab-btn" data-role="recycler">
        🏭 Authorized Recycler
      </button>
      <button class="role-tab-btn" data-role="traceability">
        📜 Traceability Dossier
      </button>
    </nav>
  </header>

  <!-- MAIN APP CONTAINER -->
  <main class="app-container">

    <!-- VERNACULAR & AUDIO STATUS BAR -->
    <div class="vernacular-bar">
      <div class="language-pills">
        <button class="lang-btn active" data-lang="en">⚪ English</button>
        <button class="lang-btn" data-lang="hi">🟢 हिंदी</button>
        <button class="lang-btn" data-lang="mr">🟠 मराठी</button>
        <button class="lang-btn" data-lang="te">🔵 తెలుగు</button>
      </div>
      <button class="audio-toggle-btn" id="audio-toggle-btn">
        🔊 Audio ON
      </button>
    </div>

    <!-- ================= 1. COLLECTOR VIEW ================= -->
    <section id="view-collector" class="view-section">
      
      <!-- Prior Screen: Collector Registration & Unique ID via Phone & OTP -->
      <div id="collector-screen-auth" class="auth-container-box">
        <!-- Dynamically rendered by App.renderCollectorAuthScreen() -->
      </div>

      <!-- Main Collector Workspace (Unlocked after OTP Verification) -->
      <div id="collector-main-workspace" style="display: none;">
        <!-- Active Collector ID Chip -->
        <div class="collector-header-chip" id="collector-header-chip">
          <!-- Dynamically populated by App.renderCollectorChip() -->
        </div>

        <!-- Sub Navigation for Collector -->
        <nav class="collector-subnav">
          <button class="subnav-btn active" data-view="rates">
            <span class="subnav-icon">📈</span>
            <span class="subnav-label">Mandi Rates</span>
          </button>
          <button class="subnav-btn" data-view="create">
            <span class="subnav-icon">📷</span>
            <span class="subnav-label">Create Lot</span>
          </button>
          <button class="subnav-btn" data-view="passbook">
            <span class="subnav-icon">📖</span>
            <span class="subnav-label">My Passbook</span>
          </button>
          <button class="subnav-btn" data-view="safety">
            <span class="subnav-icon">🛡️</span>
            <span class="subnav-label">Safety Guide</span>
          </button>
        </nav>

        <!-- Screen A: Live Rates (3 Clean Columns) -->
        <div id="collector-screen-rates" class="collector-screen card">
          <div id="rates-container">
            <!-- Dynamically populated by App.renderRates() -->
          </div>
        </div>

        <!-- Screen B: Create Lot with Real Camera -->
        <div id="collector-screen-create" class="collector-screen card" style="display: none;">
          <div id="create-lot-container">
            <!-- Dynamically populated by App.renderLotCreationForm() -->
          </div>
        </div>

        <!-- Screen C: Passbook / Ledger -->
        <div id="collector-screen-passbook" class="collector-screen card" style="display: none;">
          <div id="passbook-container">
            <!-- Dynamically populated by App.renderPassbook() -->
          </div>
        </div>

        <!-- Screen D: Safety Guidelines -->
        <div id="collector-screen-safety" class="collector-screen card" style="display: none;">
          <div id="safety-container">
            <!-- Dynamically populated by App.renderSafetyGuide() -->
          </div>
        </div>
      </div>
    </section>

    <!-- ================= 2. MICRO-HUB INTAKE PORTAL ================= -->
    <section id="view-microhub" class="view-section" style="display: none;">
      <div id="microhub-content">
        <!-- Dynamically populated by App.loadHubInventory() -->
      </div>
    </section>

    <!-- ================= 3. AUTHORIZED RECYCLER PORTAL ================= -->
    <section id="view-recycler" class="view-section" style="display: none;">
      <div id="recycler-content">
        <!-- Dynamically populated by App.loadRecyclerPortal() -->
      </div>
    </section>

    <!-- ================= 4. TRACEABILITY DOSSIER ================= -->
    <section id="view-traceability" class="view-section" style="display: none;">
      <div id="traceability-content">
        <!-- Dynamically populated by App.viewTraceability() -->
      </div>
    </section>

  </main>

  <!-- MODAL: MICRO-HUB VERIFICATION & 4-DIGIT OTP ENTRY -->
  <div id="hub-verify-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title" id="modal-verify-title">⚖️ Physical Weighing & 4-Digit OTP Verification</div>
        <button class="close-btn" onclick="App.closeHubVerifyModal()">✕</button>
      </div>

      <input type="hidden" id="modal-lot-id">

      <div style="background: #f1f5f9; padding: 10px; border-radius: 8px; margin-bottom: 14px;">
        <div style="font-weight: 800; font-size: 0.95rem;" id="modal-lot-label">LOT-XXXX</div>
        <div style="font-size: 0.8rem; color: #475569;" id="modal-declared-info">Declared Quantity: ...</div>
      </div>

      <div style="margin-bottom: 14px;">
        <label style="font-weight: 700; font-size: 0.85rem; display: block; margin-bottom: 4px;" id="modal-scale-label">
          Actual Verified Scale Weight / Qty:
        </label>
        <input type="number" step="0.1" id="modal-scale-weight" style="width: 100%; padding: 10px; border: 2px solid var(--gray-300); border-radius: 8px; font-size: 1.2rem; font-weight: 800;">
      </div>

      <div style="margin-bottom: 16px;">
        <label style="font-weight: 800; font-size: 0.9rem; color: #b45309; display: block; margin-bottom: 4px;" id="modal-otp-label">
          Collector's 4-Digit Handover OTP:
        </label>
        <input type="text" maxlength="4" id="modal-otp-input" placeholder="e.g. 5829" style="width: 100%; padding: 12px; border: 2px solid #f59e0b; border-radius: 8px; font-size: 1.5rem; font-weight: 900; letter-spacing: 6px; text-align: center; background: #fefce8;">
        <small style="color: #64748b; font-size: 0.75rem;" id="modal-otp-helper">Enter the 4-digit code shown on the collector's screen.</small>
      </div>

      <div style="margin-bottom: 16px;">
        <label style="font-weight: 700; font-size: 0.85rem; display: block; margin-bottom: 6px;" id="modal-payment-title">
          Payment Method:
        </label>
        <div style="display: flex; gap: 14px;">
          <label style="font-weight: 700; cursor: pointer;" id="modal-cash-label">
            <input type="radio" name="payment-mode-radio" value="CASH" checked> <span id="modal-cash-text">💵 Paid in Cash</span>
          </label>
          <label style="font-weight: 700; cursor: pointer;" id="modal-upi-label">
            <input type="radio" name="payment-mode-radio" value="UPI"> <span id="modal-upi-text">📱 Instant Direct UPI</span>
          </label>
        </div>
      </div>

      <button class="btn-primary-large" id="modal-confirm-btn" onclick="App.confirmHubIntake()">
        ✅ Confirm Scale Weight & OTP Handshake
      </button>
    </div>
  </div>

  <!-- TOAST NOTIFICATION CONTAINER -->
  <div id="toast">Notification</div>

  <!-- SCRIPTS -->
  <script src="/static/js/translations.js"></script>
  <script src="/static/js/audio.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
